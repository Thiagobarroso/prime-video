<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css
    " />
</head>

<body>


  <div class="container">
    <div id="debug">
      <p></p>
    </div>
    <h1>Filmes</h1>
    <form class="p-5 mb-4 bg-dark-subtle rounded-3">
      <div class="row">
        <div class="col-4">
          <input type="text" class="form-control" placeholder="Nome do filme" id="nomeFilme"
            onkeyup="atualizarDados()" />
        </div>
        <div class="col-3">
          <input type="text" class="form-control" placeholder="url" id="url" onkeyup="atualizarDados()" />
        </div>
        <div class="col-3">
          <select class="form-control" name="Genero" id="genero" placeholder="Genero" onchange="atualizarDados()">
            <option value="" selected disabled>Selecione o gênero</option>
            <option value="acao">Ação</option>
            <option value="aventura">Aventura</option>
            <option value="comedia">Comédia</option>
            <option value="drama">Drama</option>
            <option value="fantasia">Fantasia</option>
            <option value="ficcao">Ficção Científica</option>
            <option value="romance">Romance</option>
            <option value="terror">Terror</option>
          </select>
        </div>
        <div class="col-2">
          <input type="number" class="form-control" placeholder="Ano" id="ano" onkeyup="atualizarDados()" />
        </div>
      </div>
      <br />
      <div class="d-grid gap-2">
        <a onclick="criarItem()" class="btn btn-primary btn-lg btn-success" type="button">Cadastrar Filme</a>
      </div>
    </form>

    <table class="table table-striped">
      <th>
        <tr>
          <th>nome</th>
          <th>categoria</th>
          <th>ano</th>
          <th>ação</th>
        </tr>
      </th>
      <tbody id="tabelaFilmes">
        <td>n</td>
        <td>categoria</td>
        <td>ano</td>
        <td>
          <button class="btn btn-danger">Excluir</button>
          <button class="btn btn-info">Acessar</button>
        </td>
        </tr>
      </tbody>
    </table>
  </div>


  <script>
    let dados = {
      nome: "",
      genero: "",
      ano: 0,
      url: ""
    };

    function atualizarDados() {
      dados = {
        nome: nomeFilme = document.getElementById("nomeFilme").value,
        url: url = document.getElementById("url").value,
        genero: document.getElementById("genero").value,
        ano: document.getElementById("ano").value,
      }
      document.getElementById("debug").innerHTML = JSON.stringify(dados);
    };

    const criarItem = () => {
      const tabela = document.getElementById("tabelaFilmes");
      const tr = document.createElement("tr");
      tr.innerHTML = `
            <td>${dados.nome}</td>
            <td>${dados.genero}</td>
            <td>${dados.ano}</td>
            <td>
                <button class="btn btn-danger" onclick="excluirItem(this)">Excluir</button>
                <button class="btn btn-info">Acessar</button>
            </td>`;
      tabela.appendChild(tr);
      dados = {}
    };

  </script>

</body>

</html>
